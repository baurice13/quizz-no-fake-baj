<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quel instrument es-tu ?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Variables Telegram */
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --btn-color: var(--tg-theme-button-color, #0a84ff);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; user-select: none; }
        #app { width: 100%; max-width: 500px; padding: 20px; text-align: center; }

        /* Écrans */
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Barre de progression */
        .progress-wrapper { width: 100%; height: 12px; background: var(--secondary-bg); border-radius: 20px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--btn-color); border-radius: 20px; transition: width 0.4s ease; }

        /* Questions & Boutons */
        h2.question-title { font-size: 22px; margin-bottom: 25px; line-height: 1.3; }
        .options { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn { background: var(--secondary-bg); color: var(--text-color); border: 2px solid transparent; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn:active { transform: scale(0.97); background: var(--btn-color); color: var(--btn-text-color); }

        /* Chargement Fake */
        .spinner { width: 50px; height: 50px; border: 5px solid var(--secondary-bg); border-top: 5px solid var(--btn-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: var(--hint-color); }

        /* Résultat */
        .result-title { font-size: 32px; font-weight: 900; text-transform: uppercase; background: linear-gradient(135deg, #FFD700, #FF8C00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .halo-container { position: relative; margin: 40px 0; display: flex; justify-content: center; align-items: center; }
        .halo { position: absolute; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 215, 0, 0) 70%); border-radius: 50%; z-index: -1; animation: pulse 2s infinite alternate ease-in-out; }
        .instrument-img { width: 180px; height: auto; z-index: 1; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); animation: dance 1.2s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        
        @keyframes dance { 0% { transform: rotate(-12deg) scale(0.95); } 100% { transform: rotate(12deg) scale(1.05); } }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 1; } }

        .btn-primary { background: var(--btn-color); color: var(--btn-text-color); width: 100%; margin-top: 30px; }
    </style>
</head>
<body>

<div id="app">
    <!-- ECRAN QUIZ -->
    <div id="quiz-screen" class="screen active">
        <div class="progress-wrapper"><div id="progress-bar" class="progress-bar"></div></div>
        <h2 id="question-text" class="question-title">Chargement...</h2>
        <div id="options-container" class="options"></div>
    </div>

    <!-- ECRAN CHARGEMENT -->
    <div id="loading-screen" class="screen">
        <div class="spinner"></div>
        <div id="loader-text" class="loader-text">Analyse...</div>
    </div>

    <!-- ECRAN RESULTAT -->
    <div id="result-screen" class="screen">
        <h1 id="result-name" class="result-title">TU ES...</h1>
        <div class="halo-container">
            <div class="halo"></div>
            <!-- L'image changera dynamiquement en JS -->
            <img id="result-image" src="" alt="Instrument" class="instrument-img">
        </div>
        <button class="btn btn-primary" onclick="shareResult()">Partager mon résultat 🎶</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. BASE DE DONNÉES DES INSTRUMENTS
    // N'oublie pas de remplacer les URL_BASE64_XXX par tes vrais codes !
    const instruments = {
        "tenor": { name: "LE SAXOPHONE TÉNOR", img: "URL_BASE64_TENOR" },
        "alto": { name: "LE SAXOPHONE ALTO", img: "URL_BASE64_ALTO" },
        "baryton": { name: "LE SAXOPHONE BARYTON", img: "URL_BASE64_BARYTON" },
        "trompette": { name: "LA TROMPETTE", img: "URL_BASE64_TROMPETTE" },
        "euphonium": { name: "L'EUPHONIUM", img: "URL_BASE64_EUPHONIUM" },
        "soubasophone": { name: "LE SOUBASOPHONE", img: "URL_BASE64_SOUBA" },
        "trombone": { name: "LE TROMBONE", img: "URL_BASE64_TROMBONE" },
        "percussions": { name: "LES PERCUSSIONS", img: "URL_BASE64_PERCUS" }
    };

    // 2. BASE DE DONNÉES DES QUESTIONS
    const questions = [
        {
            q: "Ton cocktail préféré ;)",
            options: [
                { text: "Le whisky CACA", type: ["trompette", "tenor"] },
                { text: "UN bon Rhum pasrangé", type: ["percussions", "alto"] },
                { text: "Le Tek PAF", type: ["trombone", "soubasophone"] },
                { text: "Une bonne vielle 8.67", type: ["baryton", "euphonium"] }
            ]
        },
        {
            q: "Ton bruit préféré ?",
            options: [
                { text: "Une craie bien stridante sur un tableau", type: ["trompette", "alto"] },
                { text: "eheh un pet eheh prout", type: ["soubasophone", "euphonium"] },
                { text: "un 440hz des familles", type: ["trombone", "tenor"] },
                { text: "des coups sourds sur une poubelle", type: ["percussions", "baryton"] }
            ]
        },
        {
            q: "Ton endroit rêvé pour un mariage",
            options: [
                { text: "Gare du Nord", type: ["baryton", "tenor"] },
                { text: "Barbès-Rochechouart", type: ["trombone", "soubasophone"] },
                { text: "Châtelet - Les Halles", type: ["percussions", "trompette"] },
                { text: "Montparnasse-Bienvenüe", type: ["euphonium", "euphonium"] }
            ]
        }
    ];

    // Tableau des scores
    let scores = { tenor: 0, alto: 0, baryton: 0, trompette: 0, euphonium: 0, soubasophone: 0, trombone: 0, percussions: 0 };
    let currentIndex = 0;
    let winningInstrument = ""; 

    const screens = {
        quiz: document.getElementById('quiz-screen'),
        loading: document.getElementById('loading-screen'),
        result: document.getElementById('result-screen')
    };

    function showScreen(screenId) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[screenId].classList.add('active');
    }

    function renderQuestion() {
        const qObj = questions[currentIndex];
        document.getElementById('question-text').innerText = qObj.q;
        
        const progress = (currentIndex / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 

        qObj.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt.text;
            btn.onclick = () => handleAnswer(opt.type);
            optionsContainer.appendChild(btn);
        });
    }

    // --- FONCTION DE GESTION DES RÉPONSES MISE À JOUR ---
    function handleAnswer(instrumentType) {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        // AJOUT DES POINTS
        if (Array.isArray(instrumentType)) {
            // S'il y a plusieurs instruments dans un tableau (ex: ["trompette", "percussions"])
            instrumentType.forEach(inst => {
                if (scores[inst] !== undefined) scores[inst] += 1;
            });
        } else {
            // S'il n'y a qu'un seul instrument en texte simple (ex: "tenor")
            if (scores[instrumentType] !== undefined) scores[instrumentType] += 1;
        }

        currentIndex++;
        if (currentIndex < questions.length) {
            renderQuestion();
        } else {
            calculateWinner(); 
            startFakeLoading();
        }
    }

    // --- FONCTION DE CALCUL DU GAGNANT MISE À JOUR (Gestion des égalités) ---
    function calculateWinner() {
        // 1. On trouve le score maximum atteint
        const maxScore = Math.max(...Object.values(scores));
        
        // 2. On récupère la liste de tous les instruments qui ont ce score maximum
        const winners = Object.keys(scores).filter(inst => scores[inst] === maxScore);
        
        // 3. S'il y a des égalités, on en choisit un au hasard !
        const randomIndex = Math.floor(Math.random() * winners.length);
        winningInstrument = winners[randomIndex];
    }

    function startFakeLoading() {
        showScreen('loading');
        document.getElementById('progress-bar').style.width = '100%';

        const fakeTexts = ["Analyse de ton aura musicale...", "Calcul de ton groove...", "Consultation des dieux du Cuivre..."];
        let textIdx = 0;
        const loaderEl = document.getElementById('loader-text');
        loaderEl.innerText = fakeTexts[0];

        const textInterval = setInterval(() => {
            textIdx++;
            if (textIdx < fakeTexts.length) loaderEl.innerText = fakeTexts[textIdx];
        }, 1000);

        setTimeout(() => {
            clearInterval(textInterval);
            showResult();
        }, 3000);
    }

    function showResult() {
        showScreen('result');
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
        const finalData = instruments[winningInstrument];
        
        document.getElementById('result-name').innerText = `TU ES ${finalData.name} !`;
        document.getElementById('result-image').src = finalData.img;

        playJazzAudio();
    }

    function playJazzAudio() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const playNote = (freq, startTime, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, startTime);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, startTime);
                filter.frequency.exponentialRampToValueAtTime(3000, startTime + 0.1);
                filter.frequency.exponentialRampToValueAtTime(100, startTime + duration);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.4, startTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                osc.start(startTime); osc.stop(startTime + duration);
            };
            playNote(233.08, now, 2); playNote(293.66, now, 2); playNote(349.23, now, 2); playNote(440.00, now, 2);
        } catch (e) { console.error("Web Audio", e); }
    }

    function shareResult() {
        const appLink = "https://t.me/quizz_baj_vrai_bot/vrai"; 
        
        const instName = instruments[winningInstrument].name;
        const message = `L'algo a parlé, je suis ${instName.toLowerCase()} ! Fais le test pour découvrir ton instrument :`;
        
        const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(appLink)}&text=${encodeURIComponent(message)}`;
        tg.openTelegramLink(telegramUrl);
    }

    renderQuestion();

</script>
</body>
</html>
